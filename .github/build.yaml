name: Build Star Reach

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    name: Windows C++20 Build
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 1. Cache vcpkg archives to prevent 3-minute EnTT/JSON recompiles
    - name: Restore vcpkg Binary Cache
      uses: actions/cache@v4
      with:
        path: ${{ env.LOCALAPPDATA }}\vcpkg\archives
        key: ${{ runner.os }}-vcpkg-archives-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-archives-

    # 2. Configure CMake using the GitHub runner's pre-installed vcpkg
    - name: Configure CMake
      run: >
        cmake -B build -S . 
        -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
        -DCMAKE_BUILD_TYPE=Release

    # 3. Build the Engine
    - name: Build
      run: cmake --build build --config Release

    # 4. Execute the Smoke Test
    - name: Run Executable
      run: .\build\bin\StarReach.exe