name: Build Star Reach

# This file previously sat at .github/build.yaml -- one directory too high. GitHub Actions reads
# only .github/workflows/*.yml|*.yaml, so CI was silently OFF. Moving it turned CI on.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # A weekly build of an UNCHANGED main, which sounds redundant and is not. Our toolchain is not
  # pinned end to end: the runner images ship vcpkg, CMake and compilers that move on GitHub's
  # schedule, so main rots while sitting still and CI only notices on the next push.
  #
  # On 2026-08-12 that gap was ten days, and the bill arrived on a 19k-line PR: the windows-latest
  # image's vcpkg binary had outrun our pinned baseline's tool-data schema (see
  # tools/ci/sync_vcpkg_baseline.sh note 3). Nothing in the PR caused it, but the PR is where it
  # surfaced, which is the expensive place to debug it -- a large diff is the first suspect even
  # when it is innocent.
  #
  # Running against an unchanged tree makes the diagnosis free: nothing changed on our side, so a
  # new failure is the environment, full stop. Monday 06:00 UTC so the week starts with a known
  # state. Cost is one matrix run a week; the alternative is paying for it inside a PR instead.
  schedule:
    - cron: "0 6 * * 1"

  # Lets the same drift check be run on demand from the Actions tab without an empty commit.
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------------------------------------
  # The structural checks run FIRST and independently of any compiler.
  #
  # architecture.md section 8 calls these the highest-leverage items in the pipeline, and they
  # are a few seconds of Python each. They gate the expensive matrix build below, so a PR that
  # grows a god object fails in under a minute instead of after three platform builds.
  # -------------------------------------------------------------------------------------------
  enforce:
    name: Structural enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Size caps (section 2.2)
        run: python tools/ci/check_sizes.py

      - name: Layer include rules (section 2.3)
        run: python tools/ci/check_layers.py

      - name: Single content pipeline (Law 10)
        run: python tools/ci/check_content_pipeline.py

      - name: No empty scaffolding (section 2.4)
        run: python tools/ci/check_dead_dirs.py

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check clang-format
        run: |
          clang-format --version
          find src tests -type f \( -name '*.h' -o -name '*.cpp' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

  clang-tidy:
    name: clang-tidy
    needs: [enforce]
    runs-on: ubuntu-latest
    env:
      # vcpkg's ASSET cache -- the downloaded source tarballs (catch2, entt, raylib, ...) --
      # distinct from the BUILT-BINARY cache below (actions/cache on vcpkg/archives). Observed
      # 2026-08-12: catch2's tarball download from github.com's archive endpoint 503's or drops
      # the connection intermittently, and vcpkg's own instant internal retry (3 attempts, no
      # backoff) doesn't give a CDN blip time to clear. The binary cache can't help here either --
      # it has nothing to restore until a build gets past this download at least once.
      #
      # x-gha stores assets in the GitHub Actions cache backend, keyed by content hash, shared
      # across every branch and job. Once any run successfully downloads a given tarball, every
      # future run reuses it regardless of whether github.com's archive endpoint is having a bad
      # day -- turning a recurring flake into a one-time cost. Requires the
      # ACTIONS_CACHE_URL/ACTIONS_RUNTIME_TOKEN step below; vcpkg-tool reads them from the
      # environment, there is no other configuration surface for it.
      X_VCPKG_ASSET_SOURCES: "x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4

      # See this job's X_VCPKG_ASSET_SOURCES comment above for why this exists. GitHub does not
      # expose these as ordinary step outputs -- github-script's core.exportVariable is the
      # documented way to surface them to subsequent steps' environment.
      - name: Export vcpkg asset-cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install raylib's X11/GL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libxkbcommon-x11-dev

      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy-18

      # Supplies a consistent CMake and Ninja, which the presets require.
      - uses: lukka/get-cmake@latest

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: ${{ runner.os }}-vcpkg-

      - name: Point VCPKG_ROOT at the runner's vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Sync vcpkg to the pinned baseline
        run: bash tools/ci/sync_vcpkg_baseline.sh

      # clang-tidy reads compile flags (include paths, defines) from compile_commands.json --
      # this is a real configure, not a lint-only step, because there is no other way to give it
      # vcpkg's EnTT/raylib/nlohmann_json include paths correctly.
      - name: Configure (generates compile_commands.json)
        run: cmake --preset release

      - name: Run clang-tidy
        run: |
          clang-tidy-18 --version
          # -P "$(nproc)" alone does nothing here: without -n, xargs packs as many of the 106
          # filenames as fit on one command line into a SINGLE clang-tidy-18 invocation (they all
          # fit -- confirmed against a real run: one continuous "[N/106] Processing file" counter
          # from a single process, not 106 separate ones), so there was only ever one job for -P
          # to schedule. -n 1 forces one file per invocation, which is what actually lets -P fan
          # out across cores -- files are independent of each other, so this is the standard LLVM
          # run-clang-tidy pattern, not a correctness risk.
          find src tests -type f -name '*.cpp' -print0 \
            | xargs -0 -n 1 -P "$(nproc)" clang-tidy-18 -p build/release

  build:
    name: ${{ matrix.name }}
    needs: [enforce]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows / MSVC", os: windows-latest }
          - { name: "Linux / GCC", os: ubuntu-latest }
          - { name: "macOS / Clang", os: macos-latest }

    # vcpkg's asset (source tarball) cache -- see the clang-tidy job's X_VCPKG_ASSET_SOURCES
    # comment for why this exists. Same env var, same GitHub Actions cache backend, shared across
    # every job and platform in this workflow.
    env:
      X_VCPKG_ASSET_SOURCES: "x-gha,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Export vcpkg asset-cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install raylib's X11/GL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libxkbcommon-x11-dev

      # Supplies a consistent CMake and Ninja on all three runners, which the presets require.
      - uses: lukka/get-cmake@latest

      - name: Set up the MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Windows Defender's real-time scanning inspects every object/lib/exe write during
      # compilation, a well-documented 2-4x slowdown for C++ builds specifically on Windows
      # runners. Scoped to the workspace only, not the vcpkg archive cache below: the workspace
      # is destroyed with the runner at the end of every job, but the cache is restored by
      # actions/cache and persists across runs -- excluding it would mean a poisoned cache entry
      # stays unscanned on every future job that restores it, a materially different risk than
      # "gone in an hour." The workspace is also where the actual object-file write volume this
      # step targets lives, so narrowing to it costs little of the speedup.
      - name: Exclude the workspace from Windows Defender scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      # Caching the binary archives is what keeps this job from recompiling raylib and EnTT from
      # source on every push.
      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ${{ env.LOCALAPPDATA }}\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: ${{ runner.os }}-vcpkg-

      # The runners ship vcpkg at VCPKG_INSTALLATION_ROOT; CMakePresets.json reads VCPKG_ROOT.
      # Exporting one to the other is what lets CI and a contributor's machine share a preset.
      - name: Point VCPKG_ROOT at the runner's vcpkg
        shell: bash
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Sync vcpkg to the pinned baseline
        shell: bash
        run: bash tools/ci/sync_vcpkg_baseline.sh

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      # No smoke-run of the executable: it now opens a window, and the runners are headless.
      # Coverage of the startup path lives in tests/integration/ContentTests.cpp, which loads and
      # validates the same data/base_game files main() does.
      - name: Test
        run: ctest --preset release

  asan:
    name: AddressSanitizer
    needs: [enforce]
    runs-on: ubuntu-latest
    # vcpkg's asset (source tarball) cache -- see the clang-tidy job's X_VCPKG_ASSET_SOURCES
    # comment for why this exists.
    env:
      X_VCPKG_ASSET_SOURCES: "x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4

      - name: Export vcpkg asset-cache credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install raylib's X11/GL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libxkbcommon-x11-dev

      - uses: lukka/get-cmake@latest

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: ${{ runner.os }}-vcpkg-

      - name: Point VCPKG_ROOT at the runner's vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Sync vcpkg to the pinned baseline
        run: bash tools/ci/sync_vcpkg_baseline.sh

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan

      # Same headless caveat as the release matrix build above -- ctest runs the unit/integration
      # suite, not StarReach.exe itself.
      - name: Test
        run: ctest --preset asan
